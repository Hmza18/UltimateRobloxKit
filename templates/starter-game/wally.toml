# Wally package manifest. `python3 urk.py packages --project .` adds pinned Fusion, Promise and
# ProfileStore (a server-realm package, so it goes under [server-dependencies]), maps Packages and
# ServerPackages in default.project.json and runs `wally install`.
[package]
name = "your-scope/your-game"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

