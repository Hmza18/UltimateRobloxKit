<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UltimateRobloxKit Dashboard</title>
<style>
:root {
  --bg: #f4f5f8; --surface: #ffffff; --surface-2: #eef0f4; --text: #1d2129; --muted: #5d6573;
  --border: #dcdfe6; --accent: #3a6df0; --accent-ink: #ffffff; --ok: #1f8a4c; --warn: #b7791f; --err: #c53030;
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --surface: #1c1f26; --surface-2: #252932; --text: #e7e9ee; --muted: #9aa3b2;
    --border: #313642; --accent: #6f95ff; --accent-ink: #0d1020;
  }
}
:root[data-theme="dark"] {
  --bg: #14161b; --surface: #1c1f26; --surface-2: #252932; --text: #e7e9ee; --muted: #9aa3b2;
  --border: #313642; --accent: #6f95ff; --accent-ink: #0d1020;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 17px; margin: 0; }
header .ver { color: var(--muted); font-weight: 400; margin-left: 6px; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav button, .btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 8px;
  padding: 6px 12px; font: inherit; cursor: pointer; }
nav button[aria-selected="true"], .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
input[type=search], input[type=text], select { background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; font: inherit; min-width: 0; }
input[type=search] { flex: 1 1 260px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 15px; word-break: break-word; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin: 2px 4px 2px 0; }
.muted { color: var(--muted); }
code, pre { font-family: var(--mono); font-size: 12.5px; }
pre { background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.cmd { display: flex; gap: 8px; align-items: stretch; }
.cmd pre { flex: 1; margin: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
table { table-layout: fixed; }
th:first-child, td:first-child { width: 22%; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.icon { border: 1px solid var(--border); border-radius: 8px; padding: 10px 4px 6px; text-align: center; cursor: pointer; background: var(--icon-bg); }
.icon .glyph { width: 40px; height: 40px; margin: 0 auto 6px; background: var(--icon-tint);
  -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }
.icon .n { font-size: 11px; color: var(--icon-text); word-break: break-word; }
.icon.sel { outline: 2px solid var(--accent); }
.icon img.art { width: 48px; height: 48px; display: block; margin: 0 auto 4px; }
.md h1, .md h2, .md h3 { font-size: 15px; margin: 14px 0 6px; }
.md table { margin: 8px 0; }
details > summary { cursor: pointer; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--border); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 12px; }
@media (max-width: 640px) { header { position: static; } main { padding: 14px 12px 40px; } }
</style>
</head>
<body>
<header>
  <h1>UltimateRobloxKit <span class="ver">v__URK_VERSION__</span></h1>
  <nav id="tabs" role="tablist"></nav>
  <button class="btn" id="theme" title="Toggle light or dark">Theme</button>
</header>
<main id="view"></main>
<script>
const D = /*__URK_DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const copyBtn = text => `<button class="btn" data-copy="${esc(text)}">Copy</button>`;
const cmd = text => `<div class="cmd"><pre>${esc(text)}</pre>${copyBtn(text)}</div>`;
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (b) { navigator.clipboard?.writeText(b.dataset.copy); b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200); }
});

// Tiny Markdown renderer: headings, fenced code, tables, lists, inline code, bold, links.
function md(src) {
  const lines = src.split("\n"); let out = "", i = 0;
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1");
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) { let code = ""; i++; while (i < lines.length && !lines[i].startsWith("```")) code += lines[i++] + "\n"; i++; out += `<pre>${esc(code)}</pre>`; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/); if (h) { out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if (l.startsWith("|")) { let rows = []; while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      rows = rows.filter(r => !/^\|[\s:|-]+\|?$/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|"));
      out += "<table>" + rows.map((r, k) => "<tr>" + r.map(c => k ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join("") + "</tr>").join("") + "</table>"; continue; }
    if (/^\s*([-*]|\d+\.)\s/.test(l)) { let items = ""; while (i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i])) items += `<li>${inline(lines[i++].replace(/^\s*([-*]|\d+\.)\s/, ""))}</li>`; out += `<ul>${items}</ul>`; continue; }
    if (l.trim()) out += `<p>${inline(l)}</p>`; i++;
  }
  return out;
}

// Router: the same rules as scripts/automation/route.py (trigger phrases + workflow keywords).
const stem = w => w.length > 5 && w.endsWith("ing") ? w.slice(0, -3) : w.length > 4 && w.endsWith("ed") ? w.slice(0, -2)
  : w.length > 3 && w.endsWith("s") && !w.endsWith("ss") ? w.slice(0, -1) : w;
const norm = t => " " + (t.toLowerCase().match(/[a-z0-9]+/g) || []).map(stem).join(" ") + " ";
function route(task) {
  const t = norm(task), byName = Object.fromEntries(D.skills.map(s => [s.name, s]));
  const wfs = D.workflows.map(w => [w.keywords.filter(k => t.includes(norm(k))).length, w])
    .filter(([n, w]) => n >= (w.min_matches || 1)).sort((a, b) => b[0] - a[0] || (b[1].priority ?? 1) - (a[1].priority ?? 1)).slice(0, 2).map(x => x[1]);
  const chosen = [];
  wfs.forEach(w => w.skills.forEach(s => { if (byName[s] && !chosen.includes(s)) chosen.push(s); }));
  const scored = D.skills.map(s => [s.name, s.triggers.reduce((a, tr) => a + (t.includes(norm(tr)) ? (tr.includes(" ") ? 4 : 3) : 0), 0)])
    .filter(x => x[1] > 0).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  let extra = 0; scored.forEach(([n]) => { if (!chosen.includes(n) && (chosen.length < 8 || extra < 3)) { chosen.push(n); extra++; } });
  const load = []; chosen.forEach(n => { (byName[n].depends || []).forEach(d => { if (byName[d] && !load.includes(d)) load.push(d); }); if (!load.includes(n)) load.push(n); });
  return { workflows: wfs, load };
}

const VIEWS = {
  Skills() {
    const cats = [...new Set(D.skills.map(s => s.category))].sort();
    return `<div class="card" style="margin-bottom:14px"><h3>Route a task</h3>
      <div class="row"><input type="text" id="task" placeholder="e.g. Add a pet inventory with equip slots" style="flex:1 1 300px"><button class="btn primary" id="go">Route</button></div>
      <div id="routed" class="muted">Shows the workflow and the skills Claude should load, using the same rules as route.py.</div></div>
      <div class="row"><input type="search" id="q" placeholder="Search ${D.skills.length} skills by name, description or trigger">
      <select id="cat"><option value="">All categories</option>${cats.map(c => `<option>${c}</option>`).join("")}</select></div>
      <div class="grid" id="list"></div>`;
  },
  Workflows() {
    return `<div class="grid">${D.workflows.map(w => `<div class="card"><h3>${esc(w.id)}</h3>
      <div class="muted">Keywords: ${w.keywords.map(esc).join(", ")}</div>
      <p>${w.skills.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</p>
      <b>Gates</b><ul>${(w.gates || []).map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  },
  Library() {
    if (!D.library.length) return `<p class="muted">No library modules found.</p>`;
    return `<div class="row"><input type="search" id="lq" placeholder="Search ${D.library.length} modules and their READMEs"></div><div id="lib"></div>`;
  },
  Icons() {
    const cats = D.icons.categories;
    return `<div class="row"><input type="search" id="iq" placeholder="Search ${D.icons.icons.length} icons by name or tag">
      <select id="ic"><option value="">All categories</option>${cats.map(c => `<option>${c}</option>`).join("")}</select>
      <label>Tint <input type="color" id="tint" value="#ffffff"></label>
      <select id="ibg"><option value="dark">Dark background</option><option value="light">Light background</option></select>
      <select id="ist"><option value="color">Illustrated</option><option value="glyph">Glyphs (tintable)</option><option value="">All styles</option></select></div>
      <div id="isel" class="card" style="margin-bottom:12px">Select an icon to see its Luau.</div><div class="icons" id="igrid"></div>
      <p class="muted">${esc(D.icons.name)} · ${esc(D.icons.license)} · ${D.icons.sheets.length} sprite sheets of ${D.icons.sheetSize}px. Upload the sheets once, then call Icons.configure.</p>`;
  },
  Screens() {
    if (!D.screens.length) return `<p class="muted">No screen specs found.</p>`;
    return `<p class="muted">Built-in screen specs (library/src/UI/Spec/Screens). Copy one into a project with the command, then edit its JSON. Preview with <code>urk.py ui preview</code>.</p>
      <div class="grid">${D.screens.map(s => `<div class="card"><h3>${esc(s.name)}</h3><span class="tag">${esc(s.kind)}</span><span class="tag">${s.elements} elements</span>
      <p class="muted">${esc(s.description)}</p>${cmd("python3 urk.py ui new " + s.name + " --name My" + s.name + " --project " + (D.project || "~/games/MyGame"))}${cmd("python3 urk.py ui preview library/src/UI/Spec/Screens/" + s.name + ".json --open")}</div>`).join("")}</div>`;
  },
  Templates() {
    const rojo = D.templates.filter(t => t.rojo);
    return `<div class="card" style="margin-bottom:14px"><h3>New project</h3><div class="row">
      <select id="tpl">${rojo.map(t => `<option>${esc(t.name)}</option>`).join("")}</select>
      <input type="text" id="tname" value="MyGame" placeholder="Name"><input type="text" id="tdir" value="~/games/MyGame" placeholder="Folder"></div><div id="tcmd"></div></div>
      <div class="grid">${D.templates.map(t => `<div class="card"><h3>${esc(t.name)}</h3><p class="muted">${esc(t.description)}</p>
      ${t.base ? `<span class="tag">builds on ${esc(t.base)}</span>` : ""}${t.rojo ? `<span class="tag">Rojo project</span>` : ""}</div>`).join("")}</div>`;
  },
  Install() {
    const cats = [...new Set(D.skills.map(s => s.category))].sort();
    return `<div class="card"><h3>Set up a project</h3><div class="row">
      <input type="text" id="proj" value="${esc(D.project || "~/games/MyGame")}" style="flex:1 1 280px">
      <select id="prof"><option>full</option><option>code</option><option>assets</option><option>ui</option><option>design</option></select>
      <label><input type="checkbox" id="mcp"> MCP servers</label><label><input type="checkbox" id="dry" checked> Dry run</label></div><div id="scmd"></div></div>
      <div class="card" style="margin-top:12px"><h3>Pick skill categories</h3><div class="checks">${cats.map(c => `<label><input type="checkbox" class="cc" value="${c}"> ${c}</label>`).join("")}</div><div id="icmd" style="margin-top:10px"></div></div>
      <div class="card" style="margin-top:12px"><h3>Add Luau modules</h3><div class="checks">${D.library.map(m => `<label><input type="checkbox" class="lm" value="${esc(m.name)}"> ${esc(m.name)}</label>`).join("")}</div><div id="acmd" style="margin-top:10px"></div></div>
      <div class="card" style="margin-top:12px"><h3>Maintain</h3>${cmd("python3 urk.py upgrade --project " + (D.project || "~/games/MyGame") + " --dry-run")}${cmd("python3 urk.py check " + (D.project || "~/games/MyGame"))}${cmd("python3 urk.py uninstall --project " + (D.project || "~/games/MyGame") + " --dry-run")}</div>`;
  },
  Environment() {
    const cls = s => ({ ok: "ok", OK: "ok", missing: "err", ERROR: "err", mismatch: "warn", WARN: "warn" }[s] || "muted");
    const doc = D.doctor ? `<table><tr><th>Status</th><th>Item</th><th>Detail</th></tr>${D.doctor.map(i => `<tr><td class="${cls(i.status)}">${esc(i.status)}</td><td>${esc(i.item)}</td><td>${esc(i.detail)}${i.fix && i.status !== "ok" ? `<div class="muted">${esc(i.fix)}</div>` : ""}</td></tr>`).join("")}</table>` : `<p class="muted">Doctor output was not captured.</p>`;
    const chk = D.check ? `<h3 style="margin-top:16px">Project check: ${esc(D.project)}</h3><table>${D.check.map(i => `<tr><td class="${cls(i.level)}">${esc(i.level)}</td><td>${esc(i.item)}</td><td>${esc(i.detail)}</td></tr>`).join("")}</table>` : `<p class="muted">Build with <code>--project &lt;dir&gt;</code> to include a project check.</p>`;
    return `<div class="card"><p class="muted">Captured when this page was built. Refresh with:</p>${cmd("python3 urk.py dashboard --project " + (D.project || "~/games/MyGame") + " --open")}${doc}${chk}
      <p class="muted">Agents: ${D.agents.map(esc).join(", ")} · Commands: ${D.commands.map(c => "/" + esc(c)).join(", ")}</p></div>`;
  },
  Project() {
    const pc = D.projectCentre;
    const gen = `<div class="card"><h3>Generate a game</h3><div class="row"><input type="text" id="gprompt" value="pet simulator with 3 worlds and 24 pets" style="flex:1 1 300px"><input type="text" id="gname" value="PetLand"></div><div id="gcmd"></div></div>`;
    if (!pc) return gen + `<p class="muted">Rebuild with <code>python3 urk.py dashboard --project &lt;dir&gt;</code> to see that project's memory, game plan and check results.</p>`;
    return gen + `<div class="grid"><div class="card"><h3>Project memory</h3><pre>${esc(pc.memory)}</pre>${cmd(`python3 urk.py memory add decision "..." --project ${D.project}`)}</div>
      <div class="card"><h3>Game plan</h3>${pc.plan ? md(pc.plan) : '<span class="muted">No GAME_PLAN.md (made by urk generate).</span>'}</div>
      <div class="card"><h3>Release gate</h3>${cmd(`python3 urk.py release check --project ${D.project}`)}<p class="muted">Checks only. The kit never publishes; you publish from Studio.</p></div></div>`;
  },
  "UI Playground"() {
    return `<p class="muted">Every built-in screen spec. Thumbnails are HTML previews captured from the same spec, not Studio screenshots.</p><div class="grid">${D.playground.map(s => `<div class="card"><h3>${esc(s.name)} <span class="tag">${esc(s.kind)}</span></h3>
      ${s.thumb ? `<img alt="${esc(s.name)} preview" style="width:100%;border-radius:8px" src="data:image/jpeg;base64,${s.thumb}">` : '<span class="muted">no preview image</span>'}
      <p class="muted">${esc(s.description)} (${s.elements} elements)</p>${cmd(`python3 urk.py ui new ${s.name} --name My${s.name} --project <dir>`)}</div>`).join("")}</div>`;
  },
  Assets() {
    const a = D.assetLibrary, rows = o => Object.entries(o).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("");
    return `<div class="grid"><div class="card"><h3>${a.count} assets indexed</h3><table>${rows(a.kinds)}</table></div>
      <div class="card"><h3>Licences</h3><table>${rows(a.licences)}</table></div>
      <div class="card"><h3>Duplicates</h3><p>${a.identical} identical groups, ${a.similar} near-duplicate image pairs</p>${cmd("python3 urk.py assets dupes")}${cmd('python3 urk.py assets suggest "gold coin"')}</div></div>
      <h3>Packs</h3><div class="grid">${a.packs.map(p => `<div class="card"><h3>${esc(p.path)}</h3>${p.thumb ? `<img alt="" style="width:100%" src="data:image/jpeg;base64,${p.thumb}">` : ""}</div>`).join("")}</div>`;
  },
  Agents() {
    return `<div class="grid">${D.agentsInfo.map(g => `<div class="card"><h3>${esc(g.name)}</h3><p>${esc(g.description)}</p><p>${g.skills.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</p></div>`).join("")}</div>`;
  },
  Tests() {
    const t = D.tests, r = t.routing;
    const pct = x => (x * 100).toFixed(1) + "%";
    return `<div class="grid"><div class="card"><h3>Routing evaluation</h3><table><tr><th>Set</th><th>Cases</th><th>Accuracy</th><th>Tokens/task</th></tr>
      ${Object.entries(r).map(([k, v]) => `<tr><td>${k}</td><td>${v.cases}</td><td>${pct(v.accuracy)}</td><td>~${v.meanTokensLoaded}</td></tr>`).join("")}</table>
      <p class="muted">"tuned" cases were used to adjust triggers; the held-out sets were not, so they are the honest numbers.</p></div>
      <div class="card"><h3>Economy example</h3>${t.economy ? `<p>${t.economy.warnings.length ? t.economy.warnings.map(esc).join("<br>") : "No warnings"}</p><p class="muted">Median rebirths ${t.economy.medianRebirths} in ${t.economy.hours} h (simulated players).</p>` : "not available"}</div>
      <div class="card"><h3>Kit audit</h3>${t.audit ? `<p>${t.audit.HIGH} high, ${t.audit.MEDIUM} medium</p>` : "not available"}${cmd("python3 urk.py audit --kit")}</div>
      <div class="card"><h3>Suites</h3><p>${t.specs} Lune spec files, ${t.pyTests} Python test files</p>${cmd("python3 urk.py test")}<p class="muted">Results are not cached here: run the suites to see them.</p></div></div>`;
  },
};

const wire = {
  Project() {
    const draw = () => $("#gcmd").innerHTML = cmd(`python3 urk.py generate "${$("#gprompt").value}" --name ${$("#gname").value} --out ~/games/${$("#gname").value}`);
    ["#gprompt", "#gname"].forEach(s => $(s).oninput = draw); draw();
  },
  Skills() {
    const draw = () => {
      const q = $("#q").value.toLowerCase(), c = $("#cat").value;
      const hits = D.skills.filter(s => (!c || s.category === c) && (!q || (s.name + " " + s.description + " " + s.triggers.join(" ")).toLowerCase().includes(q)));
      $("#list").innerHTML = hits.map(s => `<div class="card"><h3>${esc(s.name)}</h3><span class="tag">${esc(s.category)}</span>
        <p class="muted">${esc(s.description)}</p>${s.depends.length ? `<div>Needs: ${s.depends.map(d => `<span class="tag">${esc(d)}</span>`).join("")}</div>` : ""}
        <details><summary>Triggers</summary>${s.triggers.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</details></div>`).join("") || `<p class="muted">No match.</p>`;
    };
    $("#q").oninput = draw; $("#cat").onchange = draw; draw();
    const go = () => { const t = $("#task").value.trim(); if (!t) return; const r = route(t);
      $("#routed").innerHTML = `<p><b>Workflows:</b> ${r.workflows.map(w => esc(w.id)).join(", ") || "none matched"}</p>
        <p><b>Load, in order:</b> ${r.load.map(n => `<span class="tag">${esc(n)}</span>`).join("")}</p>${cmd('python3 urk.py route "' + t.replace(/"/g, "'") + '"')}`; };
    $("#go").onclick = go; $("#task").onkeydown = e => e.key === "Enter" && go();
  },
  Library() {
    if (!$("#lq")) return;
    const draw = () => { const q = $("#lq").value.toLowerCase();
      $("#lib").innerHTML = D.library.filter(m => !q || (m.name + m.readme).toLowerCase().includes(q)).map(m => `<details class="card" style="margin-bottom:10px">
        <summary><b>${esc(m.name)}</b> <span class="muted">${m.files.length} files · ${m.tests.length} spec files</span></summary>
        ${cmd("python3 urk.py add " + m.name + " --project " + (D.project || "~/games/MyGame"))}<div class="md">${md(m.readme)}</div></details>`).join(""); };
    $("#lq").oninput = draw; draw();
  },
  Icons() {
    const grid = $("#igrid");
    const draw = () => {
      const q = $("#iq").value.toLowerCase(), c = $("#ic").value, dark = $("#ibg").value === "dark", st = $("#ist").value;
      grid.style.setProperty("--icon-tint", $("#tint").value);
      grid.style.setProperty("--icon-bg", dark ? "#22252d" : "#fafbfc");
      grid.style.setProperty("--icon-text", dark ? "#c8cdd6" : "#4a505c");
      grid.innerHTML = D.icons.icons.filter(i => (!st || (i.style || "glyph") === st) && (!c || i.category === c) && (!q || i.name.includes(q) || i.tags.some(t => t.startsWith(q))))
        .map(i => (i.style === "color"
          ? `<div class="icon" data-name="${esc(i.name)}"><img class="art" alt="" src="data:image/png;base64,${i.png}"><div class="n">${esc(i.name)}</div></div>`
          : `<div class="icon" data-name="${esc(i.name)}"><div class="glyph" style="-webkit-mask-image:url(data:image/png;base64,${i.png});mask-image:url(data:image/png;base64,${i.png})"></div><div class="n">${esc(i.name)}</div></div>`)).join("");
    };
    grid.onclick = e => { const el = e.target.closest(".icon"); if (!el) return;
      grid.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); el.classList.add("sel");
      const i = D.icons.icons.find(x => x.name === el.dataset.name), hex = $("#tint").value;
      const rgb = [1, 3, 5].map(k => parseInt(hex.slice(k, k + 2), 16)).join(", ");
      const luau = i.style === "color" ? `Icons.apply(label, "${i.name}")` : `Icons.apply(label, "${i.name}", { color = Color3.fromRGB(${rgb}) })`;
      $("#isel").innerHTML = `<b>${esc(i.name)}</b> <span class="tag">${esc(i.category)}</span> ${i.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}
        <div class="muted">sheet-${i.sheet}.png at (${i.x}, ${i.y}), ${i.w}×${i.h}</div>${cmd(luau)}${cmd('<ImageLabel UrkIcon Icon="' + i.name + '"> (tag-only: add tag UrkIcon and attribute Icon)')}`; };
    ["#iq", "#ic", "#tint", "#ibg", "#ist"].forEach(s => $(s).oninput = draw); draw();
  },
  Templates() {
    const draw = () => $("#tcmd").innerHTML = cmd(`python3 urk.py new ${$("#tpl").value} ${$("#tname").value} ${$("#tdir").value}`) + cmd(`python3 urk.py setup --project ${$("#tdir").value}`);
    ["#tpl", "#tname", "#tdir"].forEach(s => $(s).oninput = draw); draw();
  },
  Install() {
    const draw = () => {
      const p = $("#proj").value;
      $("#scmd").innerHTML = cmd(`python3 urk.py setup --project ${p} --profile ${$("#prof").value}${$("#mcp").checked ? " --with-mcp" : ""}${$("#dry").checked ? " --dry-run" : ""}`);
      const cats = [...document.querySelectorAll(".cc:checked")].map(x => x.value);
      $("#icmd").innerHTML = cats.length ? cmd(`python3 scripts/install/install.py --target ${p} --category ${cats.join(",")}`) : `<span class="muted">Tick categories to build a selective install command.</span>`;
      const mods = [...document.querySelectorAll(".lm:checked")].map(x => x.value);
      $("#acmd").innerHTML = mods.length ? cmd(`python3 urk.py add ${mods.join(" ")} --project ${p}`) : `<span class="muted">Tick modules; their dependencies are added automatically.</span>`;
    };
    document.querySelectorAll("#view input, #view select").forEach(el => el.oninput = draw); draw();
  },
};

function show(name) {
  try { localStorage.setItem("urk-tab", name); } catch (e) {}
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  $("#view").innerHTML = VIEWS[name](); (wire[name] || (() => {}))();
}
$("#tabs").innerHTML = Object.keys(VIEWS).map(n => `<button role="tab" data-tab="${n}">${n}</button>`).join("");
$("#tabs").onclick = e => e.target.dataset.tab && show(e.target.dataset.tab);
$("#theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
let start = "Skills"; try { start = localStorage.getItem("urk-tab") || start; } catch (e) {}
show(VIEWS[start] ? start : "Skills");
</script>
</body>
</html>
